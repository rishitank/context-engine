name: Release

on:
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.2). Leave empty to auto-bump patch version.'
        required: false
        type: string
      bump_type:
        description: 'Version bump type (only used if version is empty)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false
  # Triggered by tag push (manual releases)
  push:
    tags:
      - 'v*'
  # Triggered after successful CI on main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  # Check if release should proceed
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      needs_bump: ${{ steps.check.outputs.needs_bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release conditions
        id: check
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          # For workflow_dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              # Explicit version provided
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
              if [ "${{ inputs.version }}" != "$CURRENT_VERSION" ]; then
                echo "needs_bump=true" >> $GITHUB_OUTPUT
              else
                echo "needs_bump=false" >> $GITHUB_OUTPUT
              fi
            else
              # Auto-bump version based on bump_type
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              case "${{ inputs.bump_type }}" in
                major)
                  NEW_VERSION="$((MAJOR + 1)).0.0"
                  ;;
                minor)
                  NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                  ;;
                patch|*)
                  NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                  ;;
              esac
              echo "Auto-bumped to: $NEW_VERSION"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "needs_bump=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # For tag push, always release
          if [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "needs_bump=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For workflow_run, check if CI succeeded and version changed
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "CI did not succeed, skipping release"
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Check if this version tag already exists
            if git tag -l "v$CURRENT_VERSION" | grep -q .; then
              echo "Tag v$CURRENT_VERSION already exists, auto-bumping patch version"
              # Auto-bump patch version
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Auto-bumped to: $NEW_VERSION"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "needs_bump=true" >> $GITHUB_OUTPUT
            else
              echo "New version v$CURRENT_VERSION detected, will release"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
              echo "needs_bump=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          echo "Unknown trigger, skipping release"
          echo "should_release=false" >> $GITHUB_OUTPUT

  # Bump version in Cargo.toml if needed
  # Uses RELEASE_TOKEN (PAT) to bypass branch protection, falls back to GITHUB_TOKEN
  bump-version:
    needs: check
    if: needs.check.outputs.should_release == 'true' && needs.check.outputs.needs_bump == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          echo "Updating Cargo.toml to version $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cat Cargo.toml | head -5

      - name: Commit version bump
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    needs: [check, bump-version]
    # Run if should_release is true, and either no bump needed OR bump-version succeeded
    if: |
      always() &&
      needs.check.outputs.should_release == 'true' &&
      (needs.check.outputs.needs_bump != 'true' || needs.bump-version.result == 'success')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: context-engine-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: context-engine-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: context-engine-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Fetch latest to get version bump commit
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/context-engine ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Generate changelog using git-cliff (fast, free, no API keys needed)
  changelog:
    needs: [check, bump-version, build]
    if: |
      always() &&
      needs.check.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.generate.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Install git-cliff
        run: |
          # Install git-cliff v2.11.0 (Rust-based changelog generator)
          # Using latest version to address CVE-2024-32650 in rustls dependency
          VERSION="2.11.0"
          TARBALL="git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          DOWNLOAD_URL="https://github.com/orhun/git-cliff/releases/download/v${VERSION}"

          # Download the tarball and checksum
          curl -sSfL "${DOWNLOAD_URL}/${TARBALL}" -o "${TARBALL}"
          curl -sSfL "${DOWNLOAD_URL}/${TARBALL}.sha512" -o "${TARBALL}.sha512"

          # Verify checksum before installation
          echo "Verifying checksum..."
          sha512sum -c "${TARBALL}.sha512"

          # Extract and install
          tar xzf "${TARBALL}"
          sudo mv "git-cliff-${VERSION}/git-cliff" /usr/local/bin/

          # Cleanup
          rm -rf "${TARBALL}" "${TARBALL}.sha512" "git-cliff-${VERSION}"

          git-cliff --version

      - name: Generate changelog
        id: generate
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Get previous tag for range
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Generating changelog from $PREV_TAG to HEAD"

          # Create git-cliff config inline
          cat > cliff.toml << 'CLIFF_CONFIG'
          [changelog]
          header = ""
          body = """
          # Release v{{ version }}

          Released on {{ timestamp | date(format="%Y-%m-%d") }}

          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group | upper_first }}
          {% for commit in commits %}
          - {{ commit.message | split(pat="\n") | first | trim }} (`{{ commit.id | truncate(length=7, end="") }}`) - @{{ commit.author.name }}
          {%- endfor %}
          {% endfor %}
          """
          footer = ""
          trim = true

          [git]
          conventional_commits = true
          filter_unconventional = false
          split_commits = false
          commit_parsers = [
            { message = "^feat", group = "✨ Features" },
            { message = "^fix", group = "🐛 Bug Fixes" },
            { message = "^security", group = "🔒 Security" },
            { message = "^doc", group = "📚 Documentation" },
            { message = "^perf", group = "⚡ Performance" },
            { message = "^refactor", group = "🎨 Refactoring" },
            { message = "^test", group = "🧪 Tests" },
            { message = "^chore", group = "🔧 Maintenance" },
            { message = "^ci", group = "🔧 Maintenance" },
            { message = "^build", group = "🔧 Maintenance" },
            { message = ".*", group = "📦 Other" },
          ]
          filter_commits = false
          tag_pattern = "v[0-9].*"
          CLIFF_CONFIG

          # Generate changelog for this release with proper error handling
          # Capture exit code to distinguish between failure and empty output
          CLIFF_EXIT_CODE=0
          git-cliff --config cliff.toml --tag "v${VERSION}" "${PREV_TAG}..HEAD" > changelog.md 2>&1 || CLIFF_EXIT_CODE=$?

          # Check if git-cliff failed (non-zero exit code)
          if [ $CLIFF_EXIT_CODE -ne 0 ]; then
            echo "git-cliff failed with exit code $CLIFF_EXIT_CODE, using fallback"
            {
              echo "# Release v${VERSION}"
              echo ""
              echo "Released on $(date '+%Y-%m-%d')"
              echo ""
              echo "### 📦 Changes"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`) - @%an"
            } > changelog.md
          # Check if git-cliff succeeded but produced empty output
          elif [ ! -s changelog.md ]; then
            echo "git-cliff produced empty output (no commits in range), using fallback"
            {
              echo "# Release v${VERSION}"
              echo ""
              echo "Released on $(date '+%Y-%m-%d')"
              echo ""
              echo "### 📦 Changes"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`) - @%an"
            } > changelog.md
          else
            echo "git-cliff succeeded with valid output"
          fi

          # Output changelog for use in release
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Display changelog
          echo "=== Generated Changelog ==="
          cat changelog.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md

  release:
    needs: [check, bump-version, build, changelog]
    if: |
      always() &&
      needs.check.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create and push tag
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists
          if git tag -l "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists, skipping"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body: ${{ needs.changelog.outputs.changelog }}
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
